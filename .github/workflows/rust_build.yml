name: Rust

on:
  push:
    branches: [ main, smash_smashline ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly
          rustup default nightly

      - name: Install cargo-skyline
        run: cargo install cargo-skyline --locked

      - name: Build Release NRO
        run: |
          yes | cargo skyline update-std || true
          cargo skyline build --release

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: random-attack-values-nro
          path: target/aarch64-skyline-switch/release/*.nro
